<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title></title>
    </head>
    <body>
        <script>
            const numbersToString = ((...args) => {
               let arr = args.filter((item, index) => {
                    return args.indexOf(Math.abs(item)) === index;
               });
               return arr.filter((num)=> ((new Set(num.toString())).size === num.toString().length).toString());
            });

            document.write(numbersToString(4,56,23,4,6,6,88,112,-123,123));
        </script>
    </body>
</html>
