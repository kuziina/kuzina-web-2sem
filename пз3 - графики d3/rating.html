    <details>
        <summary>График</summary>
        <form id="setting">
            <p>OX</p>
            <input type="radio" id="graf" name="graf" checked value="Жанр">Жанр<br>
            <input type="radio" id="graf" name="graf" value="Год издания">Год издания<br>

            <p id="OY">OY
            <p>
                <input type="checkbox" id="graf" name="graf" value="max"> Максимальный рейтинг<br>
                <input type="checkbox" id="graf" name="graf" value="min"> Минимальный рейтинг
            <p>
                Тип графика
                <select>
                    <option value="0">Точечная диаграмма</option>
                    <option value="1">Гистограмма</option>
                    <option value="2">График</option>
                </select>
            </p>
            <p><input type="button" value="Построить" id="draw"></p>
        </form>
    </details>
    <details>
        <summary>Фильтр</summary>
        <form id="filter">
            <p>
                <label for="name">Название:</label>
                <input type="text" id="name">
            </p>
            <p>
                <label for="author">Автор:</label>
                <input type="text" id="author">
            </p>
            <p>
                <label for="yearFrom">Год:</label>
                от <input type="number" id="yearFrom">
                до <input type="number" id="yearTo">
            </p>
            <p>
                <label for="genre">Жанр:</label>
                <input type="text" id="genre">
            </p>
            <p>
                <label for="ratingFrom">Рейтинг:</label>
                от <input type="number" id="ratingFrom">
                до <input type="number" id="ratingTo">
            </p>
            <input type="button" value="Найти" id="findBtn">
            <input type="button" value="Очистить фильтры" id="clearBtn">
        </form>
    </details>
    <details>
        <summary>Сортировка</summary>
        <form id="sort">
            <p> Сортировать по:</p>
            <p>
                <select id="fieldsFirst">
                </select>
                по убыванию? <input type="checkbox" id="fieldsFirstDesc">
            </p>
            <p>
                <select id="fieldsSecond">
                </select>
                по убыванию? <input type="checkbox" id="fieldsSecondDesc">
            </p>
            <p>
                <select id="fieldsThird">
                </select>
                по убыванию? <input type="checkbox" id="fieldsThirdDesc">
            </p>
            <input type="button" value="Сортировать" id="sortBtn">
            <input type="button" value="Сбросить сортировку" id="resetBtn">
        </form>
    </details>
